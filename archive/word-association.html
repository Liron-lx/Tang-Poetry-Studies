<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <title>数字人文交互页面</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <!-- 引入 ECharts 文件 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
    .underline {
      width: 65px;
      height: 3px;
      position: absolute;
      top: 62px;
      background: black;
      border-radius: 20px;
      transition: left 0.3s ease-in-out;
    }
    </style>
        <script src="assets/js/navigation.js" defer></script>
</head>
  <body>
    <div style="width: 1440px; height: 900px; position: relative; background: white; overflow: hidden"> 
      <!-- 顶部导航栏开始 --> 
      <div style="z-index: 1000; position: relative;">
        <img style="width: 24px; height: 24px; left: 30px; top: 30px; position: absolute; z-index: 1001; cursor: pointer;" src="image/home.svg" alt="home" data-route="index.html">
        <div style="left: 438px; top: 30px; position: absolute; color: black; font-size: 16px; font-family: Arial, sans-serif; font-weight: 400; line-height: 24px; word-wrap: break-word; cursor: pointer; z-index: 1001;" data-route="interactive.html">侠踪天下</div>
        <div style="left: 597px; top: 30px; position: absolute; color: black; font-size: 16px; font-family: Arial, sans-serif; font-weight: 400; line-height: 24px; word-wrap: break-word; cursor: pointer; z-index: 1001;" data-route="poetry-emotion.html">剑影诗心</div>
        <div style="left: 763px; top: 30px; position: absolute; color: black; font-size: 16px; font-family: Arial, sans-serif; font-weight: 400; line-height: 24px; word-wrap: break-word; cursor: pointer; z-index: 1001;" data-route="word-association.html">侠骨柔情</div>
        <div style="left: 922px; top: 30px; position: absolute; color: black; font-size: 16px; font-family: Arial, sans-serif; font-weight: 400; line-height: 24px; word-wrap: break-word; cursor: pointer; z-index: 1001;" data-route="keyword-river.html">侠韵流殇</div>
        <img style="width: 24px; height: 24px; left: 1384px; top: 29px; position: absolute" src="image/menu.svg" alt="menu"> 
        <div style="width: 1400px; height: 0px; left: 16px; top: 64px; position: absolute; outline: 1px #979797 solid; outline-offset: -0.50px"></div> 
        <div class="underline" style="left: 763px;"></div>
        <img style="width: 64px; height: 18px; left: 63px; top: 34px; position: absolute" src="image/诗风侠影.svg" alt="诗风侠影"> 
      </div>
      <!-- 顶部导航栏结束 -->
      
      <!-- 继续按钮 -->
      <div style="padding: 12px; position: absolute; right: 30px; bottom: 20px; border-radius: 46.50px; flex-direction: column; justify-content: flex-start; align-items: flex-end; gap: 10px; display: inline-flex; cursor: pointer;" data-route="keyword-river.html">
        <div style="justify-content: flex-start; align-items: center; gap: 16px; display: inline-flex"> 
          <div style="color: black; font-size: 20px; font-family: MiSans; font-weight: 400; word-wrap: break-word">继续</div> 
          <div style="padding: 12px; background: #FBEEEE; border-radius: 29px; justify-content: flex-start; align-items: center; gap: 10px; display: flex"> 
            <img style="width: 16px; height: 16px;" src="image/arrow-right.svg" alt="arrow right"> 
          </div> 
        </div> 
      </div> 

      <!-- 组合图片元素 -->
      <div style="position: absolute; left: 30px; bottom: 30px; width: 120px;">
        <img style="width: 100%; height: auto;" src="image/Group 3.svg" alt="Group 3">
      </div>

      <!-- 诗词情感数据可视化 -->
      <div id="main" style="position: absolute; left: 30px; top: 84px; width: 1380px; height: 769px;"></div>
      
      <!-- 样本量和单位说明 -->
        <div style="position: fixed; left: 30px; bottom: 100px; font-size: 12px; color: #999; z-index: 1000;">
          样本量：100首唐代咏侠诗 | 单位：情感强度评分(0-10分)
        </div>
      
      <script type="text/javascript">
        // 初始化 echarts 实例
        var myChart = echarts.init(document.getElementById('main'));

        // 权威数据源：data/emotion_scores.csv（100 条，量程 0-10 分）
        var data = [];
        fetch('data/emotion_scores.csv')
          .then(function(resp) { return resp.text(); })
          .then(function(text) {
            var lines = text.trim().split(/\r?\n/);
            var headers = lines[0].replace(/^\uFEFF/, '').split(',');
            data = lines.slice(1).filter(function(l) { return l.trim().length; }).map(function(line) {
              var cols = line.split(',');
              var obj = {};
              headers.forEach(function(h, i) { obj[h] = cols[i]; });
              return obj;
            });

        var xAxisData = [];
        var seriesData = [];
        var colorList = ['#A47B75', '#C29F7B', '#F4D78B', '#8B9891', '#90A5BA', '#83A6AA', '#4D6883', '#BABABA'];
        var dimensions = ['壮怀逸兴', '孤愤悲慨', '死生超然', '同袍之谊', '家国义愤', '功名热望', '功名幻灭', '苍茫孤寂'];

        // 处理数据
        data.forEach(function(item) {
            xAxisData.push(item.author + ' - ' + item.title_cn);
            dimensions.forEach(function(dim, index) {
                var value = parseInt(item[dim]);
                var opacity;
                
                // 修正透明度规则：数据越大越透明
                if (value >= 9) {
                    opacity = 0.2;      // 最高值，最透明
                } else if (value === 8) {
                    opacity = 0.3;
                } else if (value === 7) {
                    opacity = 0.4;
                } else if (value === 6) {
                    opacity = 0.5;
                } else if (value === 5) {
                    opacity = 0.6;
                } else if (value === 4) {
                    opacity = 0.7;
                } else if (value === 3) {
                    opacity = 0.8;
                } else if (value === 2) {
                    opacity = 0.9;
                } else if (value === 1) {
                    opacity = 1.0;      // 较低值，较不透明
                } else { // value === 0
                    opacity = 1.0;      // 最低值，完全不透明（最实心）
                }
                
                seriesData.push({
                    name: item.author + ' - ' + item.title_cn + ' - ' + dim + ' - ' + value,
                    value: [xAxisData.length - 1, index, value],
                    itemStyle: {
                        color: echarts.color.modifyAlpha(colorList[index], opacity)
                    }
                });
            });
        });

        // 指定图表的配置项和数据
        var option = {
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    return params.data.name;
                }
            },
            xAxis: {
                type: 'category',
                data: xAxisData,
                position: 'top',
                axisLabel: {
                    interval: 0,
                    rotate: -90,
                    align: 'left',
                   margin: 5, 
                    verticalAlign: 'middle',
                    fontSize: 6
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#eee'
                    }
                }
            },
            yAxis: {
                type: 'category',
                data: dimensions
            },
            series: [{
                type: 'scatter',
                symbolSize: function(data) {
                    return data[2] * 5;
                },
                data: seriesData
            }]
        };

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
        
        // 添加诗名交互功能
        var originalSeriesData = JSON.parse(JSON.stringify(seriesData)); // 保存原始数据
        var lockedPoem = null; // 锁定的诗歌
        var isLocked = false; // 是否处于锁定状态
        
        // 添加圆圈点击事件
        myChart.on('click', function(params) {
            if (params.componentType === 'series') {
                // 从圆圈数据中提取诗歌名称
                var clickedPoem = params.data.name.split(' - ').slice(0, 2).join(' - ');
                
                if (isLocked && lockedPoem === clickedPoem) {
                    // 如果点击的是已锁定诗歌的圆圈，则解锁
                    isLocked = false;
                    lockedPoem = null;
                    // 恢复原始样式
                    myChart.setOption({
                        series: [{
                            data: originalSeriesData
                        }]
                    });
                } else {
                    // 锁定新的诗歌
                    isLocked = true;
                    lockedPoem = clickedPoem;
                    highlightPoem(clickedPoem);
                }
            }
        });
        
        // 点击事件 - 锁定/解锁诗歌（保持原有的诗歌名点击功能）
        myChart.getZr().on('click', function(e) {
            var pointInPixel = [e.offsetX, e.offsetY];
            var pointInGrid = myChart.convertFromPixel('grid', pointInPixel);
            
            if (pointInGrid && pointInGrid[0] >= 0 && pointInGrid[0] < xAxisData.length) {
                var xIndex = Math.round(pointInGrid[0]);
                var clickedPoem = xAxisData[xIndex];
                
                // 检查点击是否在X轴标签区域
                var gridRect = myChart.getModel().getComponent('grid').coordinateSystem.getRect();
                if (e.offsetY < gridRect.y) { // 点击在X轴标签区域
                    if (isLocked && lockedPoem === clickedPoem) {
                        // 如果点击的是已锁定的诗歌，则解锁
                        isLocked = false;
                        lockedPoem = null;
                        // 恢复原始样式
                        myChart.setOption({
                            series: [{
                                data: originalSeriesData
                            }]
                        });
                    } else {
                        // 锁定新的诗歌
                        isLocked = true;
                        lockedPoem = clickedPoem;
                        highlightPoem(clickedPoem);
                    }
                }
            }
        });
        
        // 高亮诗歌函数
        function highlightPoem(poemName) {
            var newSeriesData = originalSeriesData.map(function(item) {
                var itemPoem = item.name.split(' - ').slice(0, 2).join(' - ');
                if (itemPoem === poemName) {
                    // 高亮当前诗歌的所有气泡
                    return {
                        ...item,
                        itemStyle: {
                            ...item.itemStyle,
                            borderColor: '#333',
                            borderWidth: 2
                        }
                    };
                } else {
                    // 其他气泡变灰
                    return {
                        ...item,
                        itemStyle: {
                            color: echarts.color.modifyAlpha('#ccc', 0.3),
                            borderWidth: 0
                        }
                    };
                }
            });
            
            myChart.setOption({
                series: [{
                    data: newSeriesData
                }]
            });
        }
        
        // 鼠标悬浮事件 - 只在未锁定状态下生效
        myChart.getZr().on('mousemove', function(e) {
            if (isLocked) return; // 如果已锁定，不响应悬浮事件
            
            var pointInPixel = [e.offsetX, e.offsetY];
            var pointInGrid = myChart.convertFromPixel('grid', pointInPixel);
            
            if (pointInGrid && pointInGrid[0] >= 0 && pointInGrid[0] < xAxisData.length) {
                var xIndex = Math.round(pointInGrid[0]);
                var hoveredPoem = xAxisData[xIndex];
                
                // 检查鼠标是否在X轴标签区域
                var gridRect = myChart.getModel().getComponent('grid').coordinateSystem.getRect();
                if (e.offsetY < gridRect.y) { // 鼠标在X轴标签区域
                    highlightPoem(hoveredPoem);
                }
            }
        });
        
        // 鼠标离开图表区域时恢复原始样式（只在未锁定状态下）
        myChart.getZr().on('mouseout', function() {
            if (!isLocked) {
                myChart.setOption({
                    series: [{
                        data: originalSeriesData
                    }]
                });
            }
        });
        
        // 气泡悬浮事件 - 只在锁定状态下显示详细信息
        myChart.on('mouseover', function(params) {
            if (isLocked && params.componentType === 'series') {
                var hoveredPoem = params.data.name.split(' - ').slice(0, 2).join(' - ');
                if (hoveredPoem === lockedPoem) {
                    // 可以在这里添加更详细的tooltip或其他信息显示
                    console.log('悬浮在锁定诗歌的气泡上:', params.data.name);
                }
            }
        });
        
        // 改进tooltip，在锁定状态下显示更多信息
        myChart.setOption({
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    if (isLocked) {
                        var parts = params.data.name.split(' - ');
                        var author = parts[0];
                        var title = parts[1];
                        var dimension = parts[2];
                        var value = parts[3];
                        return author + '<br/>' + title + '<br/>' + dimension + ': ' + value;
                    } else {
                        return params.data.name;
                    }
                }
            }
        });
          });
      </script>
    </div> 
  </body>
</html>
