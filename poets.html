<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="侠者何人：骆宾王、王维、李白、高适、杜甫——五位唐代诗人的侠义诗群像。" />
  <title>诗风侠影 · 第三幕｜侠者何人</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    body { background: #fff; }
    /* ---------- 五人群像首屏 ---------- */
    .poet-stage {
      position: relative;
      min-height: clamp(25rem, 34vw, 34rem);
      overflow: hidden;
      isolation: isolate;
      background: #fff;
      border-top: 1px solid rgba(43, 43, 40, .1);
      border-bottom: 1px solid rgba(43, 43, 40, .1);
    }
    .poet-stage .stage-city {
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: 0;
      width: min(90rem, 100vw);
      max-width: none;
      transform: translateX(-50%);
      opacity: 1;
      filter: none;
      pointer-events: none;
      user-select: none;
    }
    .poet-stage .stage-ground {
      position: absolute;
      z-index: 1;
      right: 0;
      bottom: 0;
      left: 0;
      height: 0;
      background: transparent;
    }
    .poet-stage-figure {
      position: absolute;
      z-index: 2;
      bottom: 2.1rem;
      display: grid;
      justify-items: center;
      width: clamp(5.2rem, 9vw, 8.4rem);
      transform: translateX(-50%);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: opacity .22s ease, filter .22s ease, transform .22s ease;
    }
    .poet-stage-figure > img {
      display: block;
      width: 100%;
      max-height: clamp(10.5rem, 18vw, 17rem);
      object-fit: contain;
      object-position: bottom;
      filter: grayscale(1) contrast(1.4) brightness(.46);
    }
    .poet-stage-figure .stage-tag {
      position: absolute;
      top: 1.7rem;
      right: -.1rem;
      width: 1.45rem;
      height: auto;
    }
    .poet-stage-figure.figure-luo { left: 20%; }
    .poet-stage-figure.figure-wang { left: 35%; bottom: 1.6rem; }
    .poet-stage-figure.figure-li { left: 45%; bottom: 1.35rem; width: clamp(5.7rem, 10vw, 9.4rem); }
    .poet-stage-figure.figure-gao { left: 55%; bottom: 1.65rem; }
    .poet-stage-figure.figure-du { left: 66%; bottom: 1.1rem; width: clamp(6rem, 10.5vw, 9.8rem); }
    .poet-stage-figure:hover, .poet-stage-figure:focus-visible { transform: translateX(-50%) translateY(-.35rem); outline: none; }
    .poet-stage-figure:focus-visible > img { filter: grayscale(1) contrast(1.4) brightness(.46) drop-shadow(0 0 0.35rem rgba(176, 74, 58, .8)); }
    .poet-stage-figure.is-muted, .lifeline-bar.is-muted { opacity: .2; filter: grayscale(1); }
    .poet-stage-figure.is-active, .lifeline-bar.is-active { opacity: 1; }

    /* ---------- 五人时间带 ---------- */
    .lifeline {
      width: 100%;
      margin: 0 0 1rem;
      padding: 3.2rem 0 2.8rem;
      background: var(--silk);
    }
    .lifeline svg { display: block; width: min(1060px, calc(100% - 3rem)); height: auto; margin: 0 auto; }
    .lifeline .colophon { width: min(1060px, calc(100% - 3rem)); margin: .6rem auto 0 !important; }
    .lifeline-bar { cursor: pointer; transition: opacity .22s ease; }
    .lifeline-bar:focus { outline: none; }

    /* ---------- 04-2 单诗人详情 ---------- */
    #poetDetail { background: #fff; min-height: 100vh; }
    .poet-return {
      display: block;
      width: min(1060px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 2rem .75rem .6rem;
      border: 0;
      border-bottom: 1px solid rgba(43, 43, 40, .14);
      background: transparent;
      color: var(--ink-2);
      font: inherit;
      text-align: left;
      letter-spacing: .22em;
      cursor: pointer;
    }
    .poet-return:hover, .poet-return:focus-visible { color: var(--cinnabar); outline: none; }

    /* ---------- 诗人段落 ---------- */
    .poet-section {
      position: relative;
      width: min(1060px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 4.5rem 0 3rem;
      border-top: 1px solid rgba(43, 43, 40, .14);
      overflow: hidden;
    }
    .poet-section .scene-watermark {
      position: absolute;
      top: 3rem;
      font-family: var(--font-title);
      font-size: clamp(4rem, 10vw, 7rem);
      color: var(--ink);
      opacity: .05;
      writing-mode: vertical-rl;
      letter-spacing: .3em;
      pointer-events: none;
      user-select: none;
    }
    .poet-section:nth-child(odd) .scene-watermark { right: 0; }
    .poet-section:nth-child(even) .scene-watermark { left: 0; }

    .poet-grid {
      position: relative;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: clamp(1.5rem, 4vw, 3.5rem);
      align-items: start;
    }
    .portrait-col { text-align: center; position: sticky; top: 5.5rem; }
    .portrait-art {
      position: relative;
      display: grid;
      place-items: end center;
      width: min(100%, 230px);
      height: 270px;
      margin: 0 auto;
      background: url('image/poets/portrait-circle.png') center / contain no-repeat;
    }
    .portrait-art img {
      width: auto;
      height: 96%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(0 18px 24px rgba(43, 43, 40, .12));
    }
    .portrait-col .p-name {
      font-family: var(--font-title);
      font-size: 2.1rem;
      letter-spacing: .3em;
      text-indent: .3em;
      margin: .8rem 0 .3rem;
    }
    .portrait-col .p-years {
      font-family: var(--font-label);
      font-size: .72rem;
      letter-spacing: .2em;
      color: var(--ink-2);
    }
    .portrait-col .p-epithet {
      display: inline-block;
      margin-top: .7rem;
      font-family: var(--font-serif);
      font-size: .72rem;
      color: var(--cinnabar);
      border: 1px solid var(--cinnabar);
      border-radius: 2px;
      padding: .15rem .5rem;
      letter-spacing: .18em;
      transform: rotate(-2deg);
    }

    /* 双轨仪表 */
    .dual-meter { margin-top: 1.3rem; text-align: left; }
    .dual-meter .dm-label {
      display: flex;
      justify-content: space-between;
      font-size: .62rem;
      letter-spacing: .14em;
      color: var(--ink-2);
      margin-bottom: .35rem;
    }
    .dual-meter .dm-track {
      position: relative;
      height: 3px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--mist) 50%, var(--ochre) 100%);
      border-radius: 2px;
    }
    .dual-meter .dm-marker {
      position: absolute;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cinnabar);
      border: 2px solid var(--paper);
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(43, 43, 40, .25);
    }
    .dual-meter .dm-value {
      margin-top: .45rem;
      font-size: .66rem;
      color: var(--ink-2);
      text-align: center;
      letter-spacing: .1em;
    }

    /* 诗人小传与数据 */
    .p-note {
      font-family: var(--font-serif);
      font-size: .95rem;
      line-height: 2.1;
      color: var(--ink);
      max-width: 36em;
      margin: 0 0 1.6rem;
    }
    .p-stats {
      display: flex;
      gap: 2.2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .p-stat .s-num { font-family: var(--font-serif); font-size: 1.7rem; line-height: 1.1; }
    .p-stat .s-label { font-size: .66rem; letter-spacing: .2em; color: var(--ink-2); margin-top: .3rem; }

    /* 题材构成条 */
    .cluster-bars { margin-bottom: 2.2rem; max-width: 460px; }
    .cluster-bars .cb-row {
      display: grid;
      grid-template-columns: 5.2rem 1fr 1.6rem;
      align-items: center;
      gap: .7rem;
      margin-bottom: .4rem;
      font-size: .72rem;
      color: var(--ink-2);
    }
    .cluster-bars .cb-track { height: 7px; background: rgba(43,43,40,.06); border-radius: 4px; overflow: hidden; }
    .cluster-bars .cb-fill { height: 100%; border-radius: 4px; }

    /* 诗牌 */
    .plaques {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory;
      padding: .25rem 0 1rem;
      scrollbar-color: rgba(110, 110, 102, .45) transparent;
    }
    .plaque {
      flex: 0 0 calc((100% - 3rem) / 4);
      perspective: 900px;
      min-height: 240px;
      cursor: pointer;
      scroll-snap-align: start;
    }
    .plaque-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 240px;
      transition: transform .7s cubic-bezier(.4, 0, .2, 1);
      transform-style: preserve-3d;
    }
    .plaque.flipped .plaque-inner { transform: rotateY(180deg); }
    .plaque-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: rgba(237, 231, 217, .72);
      border: 1px solid rgba(43, 43, 40, .16);
      border-radius: 3px;
      padding: .9rem .8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .plaque-face.back {
      transform: rotateY(180deg);
      background: rgba(43, 43, 40, .92);
      color: var(--paper);
    }
    .plaque .q-line {
      writing-mode: vertical-rl;
      font-family: var(--font-serif);
      font-size: .98rem;
      letter-spacing: .18em;
      line-height: 1.9;
      max-height: 150px;
      overflow: hidden;
      margin: .4rem 0 auto;
    }
    .plaque .q-title {
      font-size: .62rem;
      color: var(--ink-2);
      letter-spacing: .1em;
      writing-mode: vertical-rl;
      max-height: 90px;
      overflow: hidden;
    }
    .plaque .q-foot {
      margin-top: .6rem;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .plaque .q-seal {
      font-size: .56rem;
      color: var(--cinnabar);
      border: 1px solid var(--cinnabar);
      border-radius: 2px;
      padding: .05rem .3rem;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .plaque .q-year { font-size: .62rem; color: var(--ink-2); font-family: var(--font-label); }
    .plaque .q-year.inferred { opacity: .65; font-style: normal; }
    .plaque .q-year.unavailable { color: var(--mist); }
    .plaque-face.back .b-label {
      font-size: .58rem;
      letter-spacing: .25em;
      color: var(--yellow);
      margin-bottom: .6rem;
    }
    .plaque-face.back .b-row {
      font-size: .68rem;
      line-height: 1.9;
      color: rgba(245, 242, 234, .85);
      text-align: left;
      width: 100%;
    }
    .plaque-face.back .b-row strong { color: var(--paper); font-weight: 500; }
    .plaque:hover .plaque-inner { box-shadow: 0 14px 34px rgba(43,43,40,.14); }

    @media (max-width: 760px) {
      .poet-stage { min-height: 23rem; }
      .poet-stage .stage-city { width: 54rem; bottom: 5rem; }
      .poet-stage-figure.figure-luo { left: 15%; }
      .poet-stage-figure.figure-wang { left: 31%; }
      .poet-stage-figure.figure-li { left: 47%; }
      .poet-stage-figure.figure-gao { left: 62%; }
      .poet-stage-figure.figure-du { left: 79%; }
      .poet-stage-figure .stage-tag { display: none; }
      .poet-grid { grid-template-columns: 1fr; }
      .portrait-col { position: static; }
      .portrait-art { width: 180px; height: 215px; }
      .plaque { flex-basis: min(15rem, calc(100% - 2rem)); }
    }
  </style>
</head>
<body data-chapter="ren" data-seal="人">

  <section id="poetOverview">
    <header class="act-head">
      <div class="act-no">ACT III</div>
      <div>
        <h1>侠者何人</h1>
        <p class="act-sub">第三幕 · 人 ｜ 五十六位诗人 · 五人写近三分之一</p>
      </div>
      <p class="act-question">五十六位诗人写侠，五人写了近三分之一。他们是谁？</p>
    </header>

    <section class="poet-stage" aria-label="五位诗人与长安城景">
      <img class="stage-city" src="image/poets/stage-background.png" alt="" aria-hidden="true" />
      <div class="stage-ground" aria-hidden="true"></div>
      <a class="poet-stage-figure figure-luo" href="#poet=%E9%AA%86%E5%AE%BE%E7%8E%8B" data-poet="骆宾王" aria-label="查看骆宾王详情"><img src="image/poets/骆宾王.png" alt="" /><img class="stage-tag" src="image/poets/骆宾王-字.png" alt="骆宾王" /></a>
      <a class="poet-stage-figure figure-wang" href="#poet=%E7%8E%8B%E7%BB%B4" data-poet="王维" aria-label="查看王维详情"><img src="image/poets/王维.png" alt="" /><img class="stage-tag" src="image/poets/王维-字.png" alt="王维" /></a>
      <a class="poet-stage-figure figure-li" href="#poet=%E6%9D%8E%E7%99%BD" data-poet="李白" aria-label="查看李白详情"><img src="image/poets/李白.png" alt="" /><img class="stage-tag" src="image/poets/李白-字.png" alt="李白" /></a>
      <a class="poet-stage-figure figure-gao" href="#poet=%E9%AB%98%E9%80%82" data-poet="高适" aria-label="查看高适详情"><img src="image/poets/高适.png" alt="" /><img class="stage-tag" src="image/poets/高适-字.png" alt="高适" /></a>
      <a class="poet-stage-figure figure-du" href="#poet=%E6%9D%9C%E7%94%AB" data-poet="杜甫" aria-label="查看杜甫详情"><img src="image/poets/杜甫.png" alt="" /><img class="stage-tag" src="image/poets/杜甫-字.png" alt="杜甫" /></a>
    </section>

    <section class="lifeline">
      <svg id="lifelineSvg" viewBox="0 0 1000 150" role="img" aria-label="五位诗人生卒年时间带"></svg>
      <p class="colophon" style="text-align:center; margin-top:.6rem;">初唐的骆宾王收笔那年，王维与李白刚刚出生——侠义之笔在五人间传递了一百三十年。</p>
    </section>
    <div class="act-hook" data-hook-line="他们写下这些句子时，心里装的是什么？" data-hook-next="emotions.html" data-hook-label="第四幕 · 侠心何似 →"></div>
  </section>

  <section id="poetDetail" hidden aria-live="polite">
    <button class="poet-return" type="button">返回</button>
    <main id="poets"></main>
  </section>

  <script src="assets/js/site.js"></script>
  <script>
    (function () {
      "use strict";

      var CLUSTER_COLORS = {
        "侠义抒怀类": "#2B2B28",
        "隐逸怀古类": "#6E6E66",
        "豪侠交游类": "#8B6B4F",
        "边塞报国类": "#6B4A3A",
        "市井任侠类": "#C9A06C"
      };
      var YEAR_MIN = 600, YEAR_MAX = 790;

      function x(year) { return 60 + (year - YEAR_MIN) / (YEAR_MAX - YEAR_MIN) * 880; }

      function drawLifeline(poets) {
        var svg = document.getElementById('lifelineSvg');
        var ns = 'http://www.w3.org/2000/svg';
        // 年代刻度
        [618, 700, 755, 790].forEach(function (yr) {
          var t = document.createElementNS(ns, 'text');
          t.setAttribute('x', x(yr)); t.setAttribute('y', 138);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('style', 'font-size:11px; fill:#6E6E66; font-family:EB Garamond,serif; letter-spacing:2px;');
          t.textContent = yr === 618 ? '618 唐立' : yr === 755 ? '755 安史之乱' : yr;
          svg.appendChild(t);
          var l = document.createElementNS(ns, 'line');
          l.setAttribute('x1', x(yr)); l.setAttribute('x2', x(yr));
          l.setAttribute('y1', 18); l.setAttribute('y2', 126);
          l.setAttribute('stroke', yr === 755 ? '#B04A3A' : '#C9C7BC');
          l.setAttribute('stroke-width', yr === 755 ? 1 : 0.5);
          l.setAttribute('stroke-dasharray', yr === 755 ? 'none' : '3 5');
          l.setAttribute('opacity', yr === 755 ? 0.55 : 0.8);
          svg.appendChild(l);
        });
        poets.forEach(function (p, i) {
          var yy = 34 + i * 19;
          var birth = +p.birth || YEAR_MIN, death = +p.death || YEAR_MAX;
          var bar = document.createElementNS(ns, 'rect');
          bar.setAttribute('class', 'lifeline-bar');
          bar.setAttribute('data-poet', p.name);
          bar.setAttribute('tabindex', '0');
          bar.setAttribute('role', 'button');
          bar.setAttribute('aria-label', '查看' + p.name + '详情');
          bar.setAttribute('x', x(birth)); bar.setAttribute('y', yy);
          bar.setAttribute('width', Math.max(4, x(death) - x(birth))); bar.setAttribute('height', 7);
          bar.setAttribute('rx', 3.5);
          bar.setAttribute('fill', '#8B6B4F'); bar.setAttribute('opacity', 0.28 + i * 0.1);
          svg.appendChild(bar);
          var t = document.createElementNS(ns, 'text');
          t.setAttribute('x', x(birth) - 8); t.setAttribute('y', yy + 7);
          t.setAttribute('text-anchor', 'end');
          t.setAttribute('style', 'font-size:12px; fill:#2B2B28; font-family:Noto Serif SC,serif; letter-spacing:2px;');
          t.textContent = p.name;
          svg.appendChild(t);
        });
      }

      function firstLine(poem, poet) {
        if (poem.title === poet.signature_from) return poet.signature;
        var parts = poem.text.split(/[，。！？；]/).filter(function (s) { return s.trim(); });
        return parts.slice(0, 2).join('，');
      }

      function yearLabel(poem) {
        if (poem.status === 'unavailable' || !poem.year) return { text: '待考', cls: 'unavailable' };
        if (poem.status === 'inferred') return { text: '约' + poem.year, cls: 'inferred' };
        return { text: String(poem.year), cls: '' };
      }

      function renderPoet(p) {
        var sec = document.createElement('section');
        sec.className = 'poet-section';

        var total = p.poems.length;
        var observed = p.poems.filter(function (x) { return x.status === 'observed'; }).length;
        var dualText = p.dual >= 0 ? '偏侠客 +' + p.dual.toFixed(2) : '偏诗人 ' + p.dual.toFixed(2);
        var markerPct = Math.max(2, Math.min(98, 50 + p.dual / 2.5 * 50));

        var clusterRows = Object.keys(CLUSTER_COLORS)
          .filter(function (c) { return p.clusters[c]; })
          .map(function (c) {
            var n = p.clusters[c];
            return '<div class="cb-row"><span>' + c.replace('类', '') + '</span>' +
              '<span class="cb-track"><span class="cb-fill" style="display:block;width:' + (n / total * 100) + '%;background:' + CLUSTER_COLORS[c] + '"></span></span>' +
              '<span>' + n + '</span></div>';
          }).join('');

        var plaques = p.poems.map(function (poem) {
          var yl = yearLabel(poem);
          var dualInfo = (poem.xia !== undefined)
            ? '<div class="b-row">侠客侧 <strong>' + poem.xia.toFixed(1) + '</strong> ｜ 诗人侧 <strong>' + poem.shi.toFixed(1) + '</strong></div>' : '';
          var evText = poem.status === 'observed' ? '作品级系年'
            : poem.status === 'inferred' ? '活动期推定' : '未获系年';
          return '<div class="plaque" tabindex="0" role="button" aria-label="' + p.name + poem.title + '，翻看系年证据">' +
            '<div class="plaque-inner">' +
              '<div class="plaque-face front">' +
                '<span class="q-title">' + poem.title + '</span>' +
                '<span class="q-line">' + firstLine(poem, p) + '</span>' +
                '<span class="q-foot"><span class="q-seal">' + poem.cluster.replace('类', '') + '</span>' +
                '<span class="q-year ' + yl.cls + '">' + yl.text + '</span></span>' +
              '</div>' +
              '<div class="plaque-face back">' +
                '<div class="b-label">系 年 证 据</div>' +
                '<div class="b-row"><strong>' + poem.title + '</strong></div>' +
                '<div class="b-row">' + evText + (poem.date_label && poem.date_label !== '未知' ? ' · ' + poem.date_label : '') + '</div>' +
                dualInfo +
                '<div class="b-row" style="opacity:.6; margin-top:.5rem;">' + poem.text.slice(0, 40) + '…</div>' +
              '</div>' +
            '</div></div>';
        }).join('');

        sec.innerHTML =
            '<div class="scene-watermark">' + p.scene + '</div>' +
            '<div class="poet-grid">' +
              '<div class="portrait-col">' +
              '<div class="portrait-art"><img src="image/poets/' + p.name + '.png" alt="' + p.name + '全身像" /></div>' +
              '<div class="p-name">' + p.name + '</div>' +
              '<div class="p-years">' + (p.birth || '？') + ' — ' + (p.death || '？') + '</div>' +
              '<span class="p-epithet">' + p.epithet + '</span>' +
              '<div class="dual-meter">' +
                '<div class="dm-label"><span>诗人内心</span><span>侠客世界</span></div>' +
                '<div class="dm-track"><span class="dm-marker" style="left:' + markerPct + '%"></span></div>' +
                '<div class="dm-value">' + dualText + '</div>' +
              '</div>' +
            '</div>' +
            '<div>' +
              '<p class="p-note">' + p.note + '</p>' +
              '<div class="p-stats">' +
                '<div class="p-stat"><div class="s-num">' + total + '</div><div class="s-label">语料中诗作</div></div>' +
                '<div class="p-stat"><div class="s-num">' + observed + '</div><div class="s-label">首作品级系年</div></div>' +
                '<div class="p-stat"><div class="s-num">' + (p.activity[0] || '？') + '</div><div class="s-label">始笔之年</div></div>' +
              '</div>' +
              '<div class="cluster-bars">' + clusterRows + '</div>' +
              '<div class="plaques">' + plaques + '</div>' +
            '</div>' +
          '</div>';
        return sec;
      }

      function bindPlaqueInteractions(scope) {
        scope.querySelectorAll('.plaque').forEach(function (el) {
          function toggle() { el.classList.toggle('flipped'); }
          el.addEventListener('click', toggle);
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
          });
        });
      }

      fetch('data/poets.json').then(function (r) { return r.json(); }).then(function (data) {
        drawLifeline(data.poets);
        var overview = document.getElementById('poetOverview');
        var detail = document.getElementById('poetDetail');
        var main = document.getElementById('poets');
        var returnButton = document.querySelector('.poet-return');

        function setOverviewHighlight(name) {
          overview.querySelectorAll('[data-poet]').forEach(function (el) {
            var muted = Boolean(name) && el.getAttribute('data-poet') !== name;
            el.classList.toggle('is-muted', muted);
            el.classList.toggle('is-active', Boolean(name) && !muted);
          });
        }

        function showPoetDetail(name) {
          var poet = data.poets.find(function (p) { return p.name === name; });
          if (!poet) return;
          main.replaceChildren(renderPoet(poet));
          bindPlaqueInteractions(main);
          overview.hidden = true;
          detail.hidden = false;
          history.pushState({ poet: name }, '', '#poet=' + encodeURIComponent(name));
          window.scrollTo(0, 0);
        }

        function showPoetOverview() {
          detail.hidden = true;
          overview.hidden = false;
          setOverviewHighlight('');
          history.pushState({}, '', location.pathname + location.search);
          window.scrollTo(0, 0);
        }

        function openFromHash() {
          var matched = location.hash.match(/^#poet=(.+)$/);
          if (!matched) return;
          var name = decodeURIComponent(matched[1]);
          var poet = data.poets.find(function (p) { return p.name === name; });
          if (!poet) return;
          main.replaceChildren(renderPoet(poet));
          bindPlaqueInteractions(main);
          overview.hidden = true;
          detail.hidden = false;
        }

        overview.querySelectorAll('[data-poet]').forEach(function (el) {
          var name = el.getAttribute('data-poet');
          el.addEventListener('mouseenter', function () { setOverviewHighlight(name); });
          el.addEventListener('focus', function () { setOverviewHighlight(name); });
          el.addEventListener('mouseleave', function () { setOverviewHighlight(''); });
          el.addEventListener('blur', function () { setOverviewHighlight(''); });
          el.addEventListener('click', function () {
            if (el.tagName.toLowerCase() !== 'a') showPoetDetail(name);
          });
        });
        returnButton.addEventListener('click', showPoetOverview);
        window.addEventListener('popstate', function () {
          if (location.hash) openFromHash(); else showPoetOverview();
        });
        window.addEventListener('hashchange', openFromHash);
        openFromHash();
      });
    }());
  </script>
</body>
</html>
